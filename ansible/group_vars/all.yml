---
# System-wide settings. Override these in an inventory-specific group_vars file.
amigalab_storage_root: /srv/amigalab
amigalab_storage_directories:
  - aminet
  - whdload
  - adf
  - hdf
  - kickstarts
  - workbench
  - ndk
  - docs
  - magazines
  - fish
  - demos
  - source
  - builds
  - backups
  - shared

amigalab_archive_collections:
  - aminet
  - fish
  - magazines
  - docs
  - ndk
  - adf
  - hdf
  - demos
  - source
  - workbench
  - kickstarts
amigalab_metadata_root: "{{ amigalab_storage_root }}/metadata"
amigalab_metadata_directories:
  - collections
  - objects
  - sources
  - imports
  - verification
  - transactions
  - transaction-entries
  - transaction-events
  - retry-events
  - import-events
  - verification-events
  - media
  - media-relationships
  - sidecar-relationships
  - execution-sets
  - recovery-plans
  - recovery-executions
  - recovery-reports
  - recovery-locks
  - external-sources
  - external-checks
  - external-snapshots
  - external-changes
  - mirror-plans
  - mirror-plan-events
  - external-checkpoints
  - external-check-events
  - mirror-plan-approvals
  - mirror-plan-cancellations
  - mirror-plan-supersession
  - mirror-executions
  - mirror-acquisition-entries
  - mirror-acquisition-events
  - mirror-retry-events
  - mirror-verification-events
  - mirror-reports
  - mirror-provenance
  - media-analyses
  - media-analysis-members
  - media-analysis-events
  - media-analysis-reports
  - media-analysis-supersession
  - import-approvals
  - import-reports
  - object-traces
  - verification-reports
  - verification-findings
  - file-traces
  - trace-links
  - reconciliation-reports
  - repair-plans
  - repair-plan-events
  - relationship-backfills
  - operations-runs
  - operations-events
  - operations-reports
  - notifications
  - retention-policies
  - retention-plans
  - retention-executions
  - retention-reports
amigalab_media_root: /srv/amigalab/media
amigalab_media_directories:
  - amiga-forever
  - aminet-cd
  - aminet-set
  - fred-fish
  - coverdisks
  - commercial
  - personal-backups
  - unknown
amigalab_external_cache_root: "{{ amigalab_storage_root }}/cache/external-providers"
amigalab_external_enabled: false
amigalab_external_request_timeout: 20
amigalab_external_request_delay: 1
amigalab_external_max_retries: 3
amigalab_external_user_agent: "AmigaLab/2.15 (metadata inspection)"
amigalab_mirror_connect_timeout: 30
amigalab_mirror_read_timeout: 60
amigalab_mirror_max_retries: 3
amigalab_mirror_backoff_base: 1
amigalab_mirror_max_single_file_bytes: 10737418240
amigalab_mirror_max_plan_bytes: 53687091200
amigalab_mirror_unknown_length_max_bytes: 1073741824
amigalab_mirror_free_space_margin_bytes: 1073741824
amigalab_mirror_user_agent: "AmigaLab/2.17"
amigalab_mirror_concurrency: 1
amigalab_analysis_max_member_count: 100000
amigalab_analysis_max_member_bytes: 1099511627776
amigalab_analysis_allowed_adapters:
  - directory
  - zip
  - tar
  - iso
amigalab_analysis_default_policy: all-safe-members
amigalab_analysis_unknown_license: manual-review
amigalab_analysis_deep_enabled: false
amigalab_verification_default_policy: full-hashes
amigalab_verification_chunk_size: 1048576
amigalab_verification_recent_trust_window: 86400
amigalab_verification_trace_depth_limit: 32
amigalab_repair_plan_enabled: true
amigalab_relationship_backfill_enabled: true
amigalab_catalog_enabled: true
amigalab_catalog_root: "{{ amigalab_metadata_root }}/catalog"
amigalab_catalog_database: "{{ amigalab_catalog_root }}/catalog.db"
amigalab_catalog_default_limit: 20
amigalab_catalog_max_text_bytes: 1048576
amigalab_catalog_strict_build: false
amigalab_catalog_timer_enabled: false
amigalab_meilisearch_enabled: false
amigalab_meilisearch_url: http://127.0.0.1:7700
amigalab_meilisearch_index: amigalab_catalog
amigalab_operations_enabled: false
amigalab_operations:
  source_checks:
    enabled: false
    schedule: daily
    mirror_plan_policy: none
  verification:
    enabled: false
    schedule: weekly
    collection: aminet
    policy: sha256
  reconciliation:
    enabled: false
    schedule: weekly
  retention:
    enabled: false
  notifications:
    enabled: false
amigalab_retention:
  provider_cache_days: 0
  completed_checkpoints_days: 0
  partial_snapshot_days: 0
  operations_reports_days: 0
  temporary_staging_days: 0
  verification_reports_keep: 0
amigalab_deployment_mode: standalone
amigalab_shared:
  enabled: false
  root: /srv/retrolab/shared
  download_cache: false
  services: false
amigalab_ports:
  gitea_http: 3000
  gitea_ssh: 2222
  caddy_http: 80

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - rsync
  - unzip

development_packages:
  - build-essential
  - cmake
  - gcc
  - git
  - git-lfs
  - make
  - python3
  - python3-pip
  - python3-venv

amigalab_root: /opt/amigalab
toolchain_prefix: "{{ amigalab_root }}/toolchains"
amiga_toolchain_build_packages:
  - autoconf
  - automake
  - bison
  - flex
  - libgmp-dev
  - libmpc-dev
  - libmpfr-dev
  - pkg-config
  - texinfo

emulation_packages:
  - fs-uae
  - fs-uae-launcher

# Enable only when installation from Microsoft's official repository is wanted.
vscode_repository_enabled: false
vscode_install_package: false

# These toolchains are intentionally placeholders. Acquire only legally
# redistributable toolchains and SDK inputs; no Amiga SDK material is fetched.
amiga_toolchain_placeholders:
  - m68k-amigaos-gcc
  - vbcc
  - vasm
  - vlink
