---
- name: Validate AmigaLab coexistence configuration
  ansible.builtin.assert:
    that:
      - amigalab_deployment_mode in ['standalone', 'coexist']
      - amigalab_storage_root is match('^/srv/amigalab(/|$)')
      - amigalab_metadata_root is match('^/srv/amigalab(/|$)')
      - amigalab_ports.values() | list | unique | length == amigalab_ports | length
      - amigalab_shared.enabled or amigalab_deployment_mode == 'standalone'
    fail_msg: Invalid AmigaLab namespacing, deployment mode, or port configuration.

- name: Create archive collection directories
  ansible.builtin.file:
    path: "{{ amigalab_storage_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ amigalab_archive_collections }}"

- name: Create non-destructive import staging directory
  ansible.builtin.file:
    path: "{{ amigalab_storage_root }}/staging"
    state: directory
    mode: '0755'

- name: Create transaction-specific staging directory
  ansible.builtin.file:
    path: "{{ amigalab_storage_root }}/staging/transactions"
    state: directory
    mode: '0755'

- name: Create original media root
  ansible.builtin.file:
    path: "{{ amigalab_media_root }}"
    state: directory
    mode: '0755'

- name: Create configurable original media categories
  ansible.builtin.file:
    path: "{{ amigalab_media_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ amigalab_media_directories }}"

- name: Create preservation metadata directories
  ansible.builtin.file:
    path: "{{ amigalab_metadata_root }}/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ amigalab_metadata_directories }}"

- name: Create external provider cache
  ansible.builtin.file:
    path: "{{ amigalab_external_cache_root }}"
    state: directory
    mode: '0755'

- name: Create separate collection metadata directories
  ansible.builtin.file:
    path: "{{ amigalab_metadata_root }}/collections/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ amigalab_archive_collections }}"

- name: Create default separate collection metadata when absent
  ansible.builtin.template:
    src: collection.yml.j2
    dest: "{{ amigalab_metadata_root }}/collections/{{ item }}/collection.yml"
    mode: '0644'
    force: false
  loop: "{{ amigalab_archive_collections }}"

- name: Create empty separate archive manifests when absent
  ansible.builtin.copy:
    content: "{\n  \"files\": [],\n  \"schema_version\": 1\n}\n"
    dest: "{{ amigalab_metadata_root }}/collections/{{ item }}/manifest.json"
    mode: '0644'
    force: false
  loop: "{{ amigalab_archive_collections }}"

- name: Create empty separate archive checksum files when absent
  ansible.builtin.copy:
    content: ''
    dest: "{{ amigalab_metadata_root }}/collections/{{ item }}/checksums.sha256"
    mode: '0644'
    force: false
  loop: "{{ amigalab_archive_collections }}"

- name: Report archive framework dependencies
  ansible.builtin.debug:
    msg: Archive tooling uses the Python standard library; no additional Python packages are required.
